
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>WhiterChat | Feed</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#b9cbb9",
                        "on-primary-container": "#007139",
                        "outline": "#849585",
                        "on-primary-fixed": "#00210c",
                        "surface-container-highest": "#343535",
                        "primary": "#f1ffef",
                        "on-surface": "#e3e2e2",
                        "surface-container-high": "#292a2a",

                        "surface-container-low": "#1b1c1c",
                        "on-secondary": "#003827",
                        "surface-bright": "#383939",
                        "on-error": "#690005",
                        "error": "#ffb4ab",
                        "tertiary": "#f7fcff",
                        "on-secondary-fixed-variant": "#00513a",
                        "on-secondary-container": "#004733",
                        "on-tertiary-container": "#006b84",
                        "on-tertiary-fixed": "#001f28",
                        "on-secondary-fixed": "#002116",
                        "surface-tint": "#00e479",
                        "primary-fixed-dim": "#00e479",
                        "surface-variant": "#343535",
                        "on-primary-fixed-variant": "#005228",
                        "secondary-fixed": "#67fcc6",
                        "on-background": "#e3e2e2",
                        "secondary-container": "#00bf8e",

                        "background": "#121414",

                        "error-container": "#93000a",
                        "inverse-primary": "#006d37",
                        "inverse-on-surface": "#2f3031",
                        "tertiary-fixed-dim": "#4cd6ff",
                        "inverse-surface": "#e3e2e2",
                        "surface-container-lowest": "#0d0e0f",
                        "primary-container": "#00ff88",
                        "outline-variant": "#3b4b3d",
                        "tertiary-container": "#ace8ff",
                        "primary-fixed": "#60ff99",
                        "on-tertiary-fixed-variant": "#004e60",
                        "on-tertiary": "#003543",
                        "on-primary": "#003919",
                        "secondary-fixed-dim": "#44dfab",
                        "surface-dim": "#121414",
                        "surface-container": "#1f2020"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "display": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .pulse-glow { box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }
        .glass-panel { backdrop-filter: blur(20px); background: rgba(13, 14, 15, 0.7); }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #121414; }
        ::-webkit-scrollbar-thumb { background: #1f2020; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff88; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .feed-loading-dot {
            width: 10px;
            height: 10px;
            border-radius: 9999px;
            background: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.8);
            animation: feedPulse 1.1s infinite ease-in-out;
        }
        .feed-loading-dot:nth-child(2) { animation-delay: 0.15s; }
        .feed-loading-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes feedPulse {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.45; }
            40% { transform: scale(1.15); opacity: 1; }
        }
        .author-link:hover .author-name { color: #00ff88; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container">

<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-neutral-900/50 backdrop-blur-xl border-b border-white/5">
    <div class="flex items-center gap-8">
        <span class="text-2xl font-black tracking-tighter text-emerald-400 drop-shadow-[0_0_8px_rgba(0,255,136,0.5)] font-['Manrope']">WhiterChat</span>
        <nav class="hidden md:flex gap-6">
            <a class="text-emerald-400 transition-colors font-label font-bold uppercase tracking-widest text-[11px]" href="/feed">Feed</a>
            <a class="text-neutral-400 hover:text-emerald-300 transition-colors font-label font-bold uppercase tracking-widest text-[11px]" href="#">Explore</a>
            <a class="text-neutral-400 hover:text-emerald-300 transition-colors font-label font-bold uppercase tracking-widest text-[11px]" href="#">Channels</a>
        </nav>
    </div>
    <div class="flex items-center gap-4">
        <div class="hidden md:flex bg-surface-container-lowest px-4 py-1.5 rounded-full border border-outline-variant/10 focus-within:border-primary-container/30 transition-all">
            <span class="material-symbols-outlined text-on-surface-variant text-sm mr-2">search</span>
            <input class="bg-transparent border-none text-sm focus:ring-0 p-0 w-48 text-on-surface placeholder:text-on-surface-variant/50" placeholder="Search pulses..." type="text"/>
        </div>
        <button class="flex items-center justify-center text-on-surface hover:text-emerald-400 transition-colors"><span class="material-symbols-outlined">add_circle</span></button>
        <button class="flex items-center justify-center text-on-surface hover:text-emerald-400 transition-colors"><span class="material-symbols-outlined">chat_bubble</span></button>
        <div class="w-8 h-8 rounded-full overflow-hidden border border-primary-container/20">
            <img id="user-avatar-nav" alt="User" src="https://ui-avatars.com/api/?name=W&background=00ff88&color=000"/>
        </div>
    </div>
</header>

<div class="flex pt-20 pb-24 md:pb-0 min-h-screen">
    <aside class="hidden md:flex flex-col w-64 h-[calc(100vh-80px)] fixed left-0 p-6 gap-8 bg-surface-dim">
        <div class="space-y-2">
            <p class="text-[10px] font-bold tracking-[0.2em] text-on-surface-variant/40 uppercase px-4 pb-2">Main Menu</p>
            <a class="flex items-center gap-4 px-4 py-3 bg-surface-container-high rounded-xl text-primary-container pulse-glow group" href="/feed">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">grid_view</span>
                <span class="font-headline font-bold text-sm tracking-tight">Feed</span>
            </a>
            <a class="flex items-center gap-4 px-4 py-3 text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface rounded-xl transition-all" href="#">
                <span class="material-symbols-outlined">explore</span>
                <span class="font-headline font-medium text-sm tracking-tight">Visions</span>
            </a>
        </div>
        <div class="mt-auto">
            <div class="bg-surface-container rounded-2xl p-4 border border-outline-variant/10">
                <p class="text-xs font-bold text-primary-container mb-2">PRO VERSION</p>
                <button class="w-full py-2 bg-primary-container text-on-primary-container text-[11px] font-black rounded-lg uppercase tracking-widest">Upgrade</button>
            </div>
        </div>
    </aside>

    <main class="flex-1 md:ml-64 px-4 md:px-8 max-w-5xl mx-auto w-full">
        <section class="mt-4 mb-10">
            <div class="flex items-center justify-between mb-6">
                <h2 class="font-display text-2xl font-extrabold tracking-tighter">Active Visions</h2>
                <button class="text-[11px] font-black text-primary-container uppercase tracking-widest">View all</button>
            </div>
            <div id="visions-container" class="flex gap-5 overflow-x-auto pb-4 no-scrollbar">
                <div class="flex-shrink-0 flex flex-col items-center gap-2 group cursor-pointer">
                    <div class="w-20 h-20 rounded-full border-2 border-dashed border-outline-variant flex items-center justify-center bg-surface-container-low group-hover:border-primary-container transition-all">
                        <span class="material-symbols-outlined text-primary-container">add</span>
                    </div>
                    <span class="text-[10px] font-bold text-on-surface-variant">You</span>
                </div>
            </div>
        </section>

        <section id="main-feed-container" class="grid grid-cols-1 gap-12">
            <div class="flex flex-col items-center justify-center py-20 text-on-surface-variant" id="feed-loading-state">
                <div class="flex items-center gap-2 mb-4">
                    <span class="feed-loading-dot"></span>
                    <span class="feed-loading-dot"></span>
                    <span class="feed-loading-dot"></span>
                </div>
                <div class="w-12 h-12 border-4 border-primary-container border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="font-headline font-bold text-sm animate-pulse uppercase tracking-[0.3em]">Syncing Neural Feed...</p>
            </div>
        </section>
        
        <div class="h-20"></div>
    </main>

    <aside class="hidden xl:flex flex-col w-80 h-[calc(100vh-80px)] fixed right-0 p-6 gap-6">
        <div class="bg-surface-container rounded-[2rem] p-6">
            <h3 class="font-display font-extrabold text-lg mb-6 tracking-tight">System Pulse</h3>
            <div id="trending-container" class="space-y-6">
                <div class="text-[10px] text-on-surface-variant/50 uppercase tracking-widest">Scanning network signals...</div>
            </div>
        </div>
    </aside>
</div>

<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-neutral-950/90 backdrop-blur-2xl shadow-[0_-4px_20px_rgba(0,0,0,0.5)]">
    <a class="flex flex-col items-center justify-center text-emerald-400" href="/feed">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">grid_view</span>
        <span class="font-['Manrope'] text-[10px] uppercase font-bold mt-1">Feed</span>
    </a>
    <div class="relative -mt-8">
        <a href="/create-post" class="w-14 h-14 rounded-2xl bg-primary-container text-on-primary-container flex items-center justify-center shadow-[0_8px_25px_rgba(0,255,136,0.3)]">
            <span class="material-symbols-outlined text-3xl">add_box</span>
        </a>
    </div>
    <a class="flex flex-col items-center justify-center text-neutral-500" href="/profile"><span class="material-symbols-outlined">person</span></a>
</nav>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, getIdToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getMessaging, getToken, onMessage, isSupported } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

const firebaseConfig = {
    apiKey: "AIzaSyBkjn1uIjzvmC4suZdA8bfYNO_fx5Hnj0s",
    authDomain: "comments-5e3b5.firebaseapp.com",
    projectId: "comments-5e3b5",
    storageBucket: "comments-5e3b5.firebasestorage.app",
    messagingSenderId: "907122259758",
    appId: "1:907122259758:web:7819cab50ebd74dd912cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const VAPID_PUBLIC_KEY = window.WHITERCHAT_VAPID_KEY || '';

async function registerPush(idToken) {
    try {
        const supported = await isSupported();
        if (!supported || !('serviceWorker' in navigator)) return;

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;

        const sw = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        const messaging = getMessaging(app);
        const fcmToken = await getToken(messaging, {
            vapidKey: VAPID_PUBLIC_KEY || undefined,
            serviceWorkerRegistration: sw
        });

        if (!fcmToken) return;

        await fetch('/api/auth/save-fcm-token', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${idToken}`
            },
            body: JSON.stringify({ fcmToken })
        });

        onMessage(messaging, (payload) => {
            console.log('Foreground message:', payload);
        });
    } catch (err) {
        console.error('Push registration failed:', err);
    }
}

function setGuestMode(isGuest) {
    const createPostDesktop = document.querySelector('header button .material-symbols-outlined')?.closest('button');
    const mobileCreatePost = document.querySelector('nav a[href="/create-post"]');

    if (mobileCreatePost) {
        mobileCreatePost.href = isGuest ? '/login' : '/create-post';
    }

    if (createPostDesktop) {
        createPostDesktop.disabled = false;
        createPostDesktop.dataset.guestAction = isGuest ? 'true' : 'false';
    }

    const loginHint = document.getElementById('guest-feed-hint');
    if (loginHint) {
        loginHint.classList.toggle('hidden', !isGuest);
    }
}

async function loadFeed(idToken = null) {
    const feedContainer = document.getElementById('main-feed-container');
    feedContainer.innerHTML = `
        <div class="flex flex-col items-center justify-center py-20 text-on-surface-variant">
            <div class="flex items-center gap-2 mb-4">
                <span class="feed-loading-dot"></span>
                <span class="feed-loading-dot"></span>
                <span class="feed-loading-dot"></span>
            </div>
            <div class="w-12 h-12 border-4 border-primary-container border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="font-headline font-bold text-sm animate-pulse uppercase tracking-[0.3em]">Syncing Neural Feed...</p>
        </div>`;
    
    try {
        const headers = {};
        if (idToken) {
            headers.Authorization = `Bearer ${idToken}`;
        }

        const response = await fetch('/api/feed/main', { headers });

        if (response.status === 401 || response.status === 403) {
            window.location.href = '/login';
            return;
        }

        const data = await response.json();

        if (data.success && Array.isArray(data.data) && data.data.length > 0) {
            feedContainer.innerHTML = ''; // مسح علامة التحميل

            data.data.forEach(post => {
                // التصحيح الجذري: الوصول المباشر للحقول بناءً على Schema المشروع
                const isAnonymous = post.isAnonymous === true;
                const username = isAnonymous ? 'Anonymous Entity' : (post.username || 'Whiter User');
                
                // معالجة الصورة الشخصية: استخدام post.profilePic مباشرة
                const avatar = (isAnonymous || !post.profilePic) 
                               ? `https://ui-avatars.com/api/?name=${username}&background=00ff88&color=000` 
                               : post.profilePic;
                
                const authorUsername = post.username || 'user';
                const profileHref = `/profile/${encodeURIComponent(authorUsername)}`;

                const article = `
                <article class="post-card bg-surface-container rounded-[2rem] overflow-hidden group border border-white/5 hover:border-primary-container/20 transition-all duration-500 mb-6 cursor-pointer" data-post-href="/post/${post._id}">
                    <div class="p-6 flex items-center justify-between">
                        <button type="button" class="author-link flex items-center gap-4 text-left" data-username="${authorUsername}" data-profile-href="${profileHref}">
                            <div class="relative">
                                <img src="${avatar}" class="w-12 h-12 rounded-full object-cover border border-primary-container/20">
                                <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-surface rounded-full flex items-center justify-center">
                                    <div class="w-2 h-2 bg-primary-container rounded-full animate-pulse shadow-[0_0_8px_#00ff88]"></div>
                                </div>
                            </div>
                            <div>
                                <h3 class="author-name font-headline font-extrabold text-sm tracking-tight text-on-surface transition-colors">${username}</h3>
                                <p class="text-[11px] text-on-surface-variant font-medium uppercase tracking-tighter">
                                    ${new Date(post.createdAt).toLocaleDateString()} • Global Link
                                </p>
                            </div>
                        </button>
                        <button class="material-symbols-outlined text-on-surface-variant hover:text-on-surface">more_horiz</button>
                    </div>

                    <div class="px-6 pb-4">
                        ${post.headline ? `<h4 class="text-primary-container font-black text-sm mb-2 uppercase tracking-widest">${post.headline}</h4>` : ''}
                        <p class="text-on-surface font-body text-base leading-relaxed mb-4">${post.content}</p>
                        
                        ${post.mediaURL ? `
                        <div class="aspect-[16/9] w-full rounded-2xl overflow-hidden relative group/image bg-neutral-900">
                            <img src="${post.mediaURL}" class="w-full h-full object-cover group-hover/image:scale-105 transition-transform duration-700">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-0 group-hover/image:opacity-100 transition-opacity flex flex-col justify-end p-6">
                                <span class="bg-primary-container/20 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-black text-primary-container w-fit mb-2 uppercase tracking-[0.2em]">Neural Description</span>
                                <p class="text-xs text-zinc-300 italic font-medium leading-snug">"${post.aiVisualDescription || 'No metadata available for this visual pulse.'}"</p>
                            </div>
                        </div>` : ''}

                        <div class="flex flex-wrap gap-2 mt-4">
                            ${post.tags ? post.tags.map(tag => `<span class="text-[10px] font-bold text-on-surface-variant/60 bg-surface-container-high px-2 py-1 rounded-md border border-white/5">#${tag}</span>`).join('') : ''}
                        </div>
                    </div>

                    <div class="p-6 pt-2 bg-surface-container-low/30 flex items-center justify-between">
                        <div class="flex items-center gap-6">
                            <button class="flex items-center gap-2 group/btn">
                                <span class="material-symbols-outlined text-on-surface-variant group-hover/btn:text-error transition-colors" style="font-variation-settings: 'FILL' 1;">favorite</span>
                                <span class="text-xs font-bold text-on-surface-variant">${post.engagement?.likes?.length || 0}</span>
                            </button>
                            <button class="flex items-center gap-2 group/btn">
                                <span class="material-symbols-outlined text-on-surface-variant group-hover/btn:text-primary-container transition-colors">chat_bubble</span>
                                <span class="text-xs font-bold text-on-surface-variant">0</span>
                            </button>
                            
                            ${post.music && post.music.title ? `
                            <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-black/40 rounded-full border border-white/5">
                                <span class="material-symbols-outlined text-primary-container text-sm animate-bounce">music_note</span>
                                <span class="text-[10px] font-bold text-zinc-400 truncate max-w-[120px] uppercase tracking-tighter">${post.music.title}</span>
                            </div>` : ''}
                        </div>
                        <button class="material-symbols-outlined text-on-surface-variant hover:text-primary-container transition-colors">bookmark</button>
                    </div>
                </article>`;
                
                feedContainer.insertAdjacentHTML('beforeend', article);
            });
        } else {
            feedContainer.innerHTML = `<div class="text-center py-20 opacity-50 uppercase tracking-widest text-xs">No signals found in the void.</div>`;
        }
    } catch (err) {
        console.error("Neural Sync Error:", err);
        feedContainer.innerHTML = `<div class="text-center py-20 text-error uppercase tracking-widest text-xs font-bold underline">Critical System Disconnect.</div>`;
    }
}

document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-guest-action="true"]');
    if (!target) return;
    window.location.href = '/login';
});

document.addEventListener('click', (event) => {
    const authorButton = event.target.closest('.author-link');
    if (!authorButton) return;
    const profileHref = authorButton.getAttribute('data-profile-href');
    if (profileHref) window.location.href = profileHref;
});

document.addEventListener('click', (event) => {
    const postCard = event.target.closest('.post-card');
    if (!postCard) return;
    if (event.target.closest('button, a, input, textarea')) return;

    const postHref = postCard.getAttribute('data-post-href');
    if (postHref) {
        window.location.href = postHref;
    }
});

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        setGuestMode(true);
        await loadFeed();
        return;
    }

    setGuestMode(false);

    try {
        const token = await getIdToken(user);
        await loadFeed(token);
        await registerPush(token);
    } catch (error) {
        console.error('Auth token error:', error);
        window.location.href = '/login';
    }
});
</script>
</body>
</html>
